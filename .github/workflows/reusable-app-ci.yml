name: Reusable App CI

on:
  workflow_call:
    inputs:
      runtime-version:
        type: string
        default: "20"
      project-name:
        type: string
        required: true
      service-name:
        type: string
        required: true
      image-tag:
        type: string
        required: true
      push-image:
        type: boolean
        default: false
      db-name:
        description: "Postgres DB name for tests. Leave empty if this service has no database."
        type: string
        default: ""
      service-port:
        description: "Value written as PORT in .env.test"
        type: string
        required: true
      extra-env:
        description: "Extra lines appended verbatim to .env.test (e.g. JWT_SECRET=..., REDIS_URL=...)"
        type: string
        default: ""
    secrets:
      GHCR_TOKEN:
        required: false
      SONAR_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_pass
          POSTGRES_DB: ${{ inputs.db-name || 'ci_unused_db' }}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SonarCloud needs full history for new-code detection
      - name: Create test env
        shell: bash
        run: |
          if [ -n "${{ inputs.db-name }}" ]; then
            echo "DATABASE_URL=postgresql://app_user:app_pass@localhost:5432/${{ inputs.db-name }}" >> .env.test
          fi
          echo "PORT=${{ inputs.service-port }}" >> .env.test
          echo "${{ inputs.extra-env }}" >> .env.test
      - name: Build app
        uses: walterdmt88-taskmanager/proops2026-cicd-platform/.github/actions/build-app@v3.2
        # ^ relative path works when called from same repo OR when reusable workflow + action are in same platform repo
        with:
          node-version: ${{ inputs.runtime-version }}
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Docker build + push
        uses: walterdmt88-taskmanager/proops2026-cicd-platform/.github/actions/docker-build-push@v3.2
        with:
          image-name: ${{ inputs.project-name }}/${{ inputs.service-name }}
          image-tag: ${{ inputs.image-tag }}
          push: ${{ inputs.push-image }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_TOKEN }}