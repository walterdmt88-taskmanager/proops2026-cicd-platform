name: Reusable Build
on:
  workflow_call:
    inputs:
      project-name: { type: string, required: true }
      service-name: { type: string, required: true }
      db-name:
        description: "Postgres DB name for tests. Leave empty if this service has no database."
        type: string
        default: ""
      service-port:
        description: "Value written as PORT in .env.test"
        type: string
        required: true
      extra-env:
        description: "Extra lines appended verbatim to .env.test (e.g. JWT_SECRET=..., REDIS_URL=...)"
        type: string
        default: ""
    secrets:
      GHCR_PAT: { required: true }
    outputs:
      image-tag:
        description: "The commit SHA used as the image tag"
        value: ${{ jobs.build.outputs.image-tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
    permissions:
      contents: read
      packages: write
      security-events: write
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_pass
          POSTGRES_DB: ${{ inputs.db-name || 'ci_unused_db' }}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Create test env
        shell: bash
        run: |
          if [ -n "${{ inputs.db-name }}" ]; then
            echo "DATABASE_URL=postgresql://app_user:app_pass@localhost:5432/${{ inputs.db-name }}" >> .env.test
          fi
          echo "PORT=${{ inputs.service-port }}" >> .env.test
          echo "${{ inputs.extra-env }}" >> .env.test
      - uses: walterdmt88-taskmanager/proops2026-cicd-platform/.github/actions/build-app@v3.2
        # ^ must be absolute — relative ./actions paths resolve against the CALLER's
        # checkout (user-service), not this platform repo. Same bug as Day 28.
      - id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
      - uses: walterdmt88-taskmanager/proops2026-cicd-platform/.github/actions/docker-build-push@v3.2
        with:
          image-name: ${{ inputs.project-name }}/${{ inputs.service-name }}
          image-tag: ${{ steps.set-tag.outputs.tag }}
          push: "true"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_PAT }}