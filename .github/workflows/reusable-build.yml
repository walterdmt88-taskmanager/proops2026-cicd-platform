name: Reusable Build
on:
  workflow_call:
    inputs:
      service-name: { type: string, required: true }
      ecr-repository:
        description: "ECR repository name, e.g. taskmanager/user-service (created by the service's infra/)"
        type: string
        required: true
      aws-role-arn:
        description: "IAM role the job assumes through GitHub OIDC to push to ECR"
        type: string
        required: true
      aws-region:
        type: string
        required: true
      db-name:
        description: "Postgres DB name for tests. Leave empty if this service has no database."
        type: string
        default: ""
      service-port:
        description: "Value written as PORT in .env.test"
        type: string
        required: true
      extra-env:
        description: "Extra lines appended verbatim to .env.test (e.g. JWT_SECRET=..., REDIS_URL=...)"
        type: string
        default: ""
    outputs:
      image-tag:
        description: "The commit SHA used as the image tag"
        value: ${{ jobs.build.outputs.image-tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
    permissions:
      contents: read
      id-token: write          # lets the job request an OIDC token for AWS
      security-events: write
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_pass
          POSTGRES_DB: ${{ inputs.db-name || 'ci_unused_db' }}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Create test env
        shell: bash
        run: |
          if [ -n "${{ inputs.db-name }}" ]; then
            echo "DATABASE_URL=postgresql://app_user:app_pass@localhost:5432/${{ inputs.db-name }}" >> .env.test
          fi
          echo "PORT=${{ inputs.service-port }}" >> .env.test
          echo "${{ inputs.extra-env }}" >> .env.test
      - uses: walterdmt88-taskmanager/proops2026-cicd-platform/.github/actions/build-app@v4.0.0
        # ^ must be absolute — relative ./actions paths resolve against the CALLER's
        # checkout (user-service), not this platform repo. Same bug as Day 28.
      - id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ECR tags are IMMUTABLE: a tag, once pushed, is never overwritten. A re-run of this job
      # must therefore reuse the image from the first run instead of failing on the push.
      - name: Check whether this tag already exists in ECR
        id: tag-check
        shell: bash
        env:
          ECR_REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
          AWS_REGION: ${{ inputs.aws-region }}
        run: |
          set -euo pipefail
          rc=0
          out=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" --region "$AWS_REGION" 2>&1) || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $IMAGE_TAG already exists in $ECR_REPOSITORY - skipping build and push; deploy will use the image from the first run."
          elif echo "$out" | grep -q 'ImageNotFoundException'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            # Anything else (AccessDenied, throttling, network) must not be read as "tag is free".
            echo "$out" >&2
            exit 1
          fi

      - uses: walterdmt88-taskmanager/proops2026-cicd-platform/.github/actions/docker-build-push@v4.0.0
        if: steps.tag-check.outputs.exists != 'true'
        with:
          registry: ${{ steps.ecr.outputs.registry }}
          image-name: ${{ inputs.ecr-repository }}
          image-tag: ${{ steps.set-tag.outputs.tag }}
          push: "true"
