name: "Docker Build and Push"
description: "Build a docker image, scan it for CVEs, and optionally push to a registry"

inputs:
  registry:
    description: "Container registry (e.g. ghcr.io, docker.io)"
    required: false
    default: "ghcr.io"
  image-name:
    description: "Full image name without tag"
    required: true
  image-tag:
    description: "Image tag (recommended: commit SHA)"
    required: true
  push:
    description: "Push to registry (true) or build only (false)"
    required: false
    default: "false"
  registry-username:
    description: "Registry username"
    required: false
  registry-password:
    description: "Registry password / token"
    required: false

runs:
  using: "composite"
  steps:
    - uses: docker/setup-buildx-action@v3

    - name: Build image (local only — not pushed yet)
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Image scan (container CVEs)
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: image
        image-ref: ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
        scanners: vuln
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: '1'
        format: sarif
        output: trivy-image-results.sarif

    - name: Upload image scan to Security tab
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-image-results.sarif
        category: trivy-image

    # Skipped when the caller already logged in (e.g. aws-actions/amazon-ecr-login with OIDC)
    # and so passes no static credentials.
    - name: Login to registry
      if: inputs.push == 'true' && inputs.registry-username != ''
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Push image
      if: inputs.push == 'true'
      shell: bash
      run: docker push ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}