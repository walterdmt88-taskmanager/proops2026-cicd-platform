name: "Build App"
description: "Set up runtime, install dependencies, scan dependencies for known CVEs, run tests, produce coverage"

inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "20"
  working-directory:
    description: "Where to run the build"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
    - name: Install
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
    - name: SCA scan (dependency vulnerabilities)
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: ${{ inputs.working-directory }}
        scanners: vuln
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: '1'
        format: sarif
        output: trivy-sca-results.sarif
        # Without this, format: sarif makes the action ignore `severity` and gate on ALL severities.
        limit-severities-for-sarif: true
    - name: Upload SCA scan to Security tab
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-sca-results.sarif
        category: trivy-sca
    - name: Test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm test
